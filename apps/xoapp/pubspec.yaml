name: xoapp
description: XO Game application.
publish_to: 'none'
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  core:
    path: ../../packages/core
  ui_components:
    path: ../../packages/ui_components
  tictactoe_feature:
    path: ../../packages/tictactoe_feature
  user_domain:
    path: ../../packages/user_domain
  user_feature:
    path: ../../packages/user_feature
  hooks_riverpod: ^3.1.0
  flutter_hooks: ^0.21.3+1
  riverpod_annotation: ^4.0.0
  go_router: ^17.0.1
  package_info_plus: ^8.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_crashlytics: ^5.0.7
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  shared_preferences: ^2.5.3
  build_runner: ^2.11.0
  freezed: ^3.2.3
  json_serializable: ^6.9.0
  riverpod_generator: ^4.0.0+1
  custom_lint:
  riverpod_lint:
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/img/
