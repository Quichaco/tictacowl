name: tictactoe_feature
description: Flutter UI package for TicTacToe game feature.
version: 0.0.1
publish_to: 'none'
resolution: workspace

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_hooks: ^0.21.3+1
  freezed_annotation: ^3.1.0
  hooks_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  core:
    path: ../core
  tictactoe_domain:
    path: ../tictactoe_domain
  ui_components:
    path: ../ui_components
  confetti: ^0.8.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.0
  freezed: ^3.2.3
  riverpod_generator: ^4.0.0+1

flutter:
  generate: true
  assets:
    - assets/img/
